<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>سرزمین — راهنمای تولید سه‌بعدی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   Sarzamin 3D Production Playbook — Redesign
   ═══════════════════════════════════════════════════════ */

/* ─── Custom Properties ─── */
:root {
  /* palette */
  --clay-900: #0d0a08;
  --clay-800: #14100c;
  --clay-700: #1c1712;
  --clay-600: #2a221c;
  --clay-500: #3d322a;
  --clay-400: #5a4c42;
  --clay-300: #8a7a6e;
  --clay-200: #b8aea4;
  --clay-100: #ddd6ce;
  --clay-50:  #f0ebe6;

  --gold-600: #8a7030;
  --gold-500: #b8953e;
  --gold-400: #c7a45b;
  --gold-300: #d4b87a;
  --gold-200: #e2cd99;

  --lapis-800: #0f1f30;
  --lapis-700: #162a40;
  --lapis-600: #1e3a55;
  --lapis-500: #2a4a6b;
  --lapis-400: #3d6487;
  --lapis-300: #5a80a3;

  --stone-200: #d4c9b8;
  --stone-300: #b8aea4;
  --stone-400: #8a7e72;
  --stone-500: #5c5248;

  /* semantic */
  --bg-page:          var(--clay-900);
  --bg-elevated:      var(--clay-800);
  --bg-card:          var(--clay-700);
  --bg-nav:           rgba(12, 9, 7, 0.92);
  --bg-code:          var(--clay-800);
  --border-light:     rgba(255, 255, 255, 0.04);
  --border-med:       rgba(255, 255, 255, 0.07);
  --border-gold:      rgba(199, 164, 91, 0.18);
  --text-primary:     var(--clay-50);
  --text-secondary:   var(--stone-200);
  --text-tertiary:    var(--stone-400);
  --text-gold:        var(--gold-400);
  --text-gold-bright: var(--gold-200);
  --text-link:        var(--gold-400);

  /* type scale */
  --fs-xs:   0.75rem;
  --fs-sm:   0.8125rem;
  --fs-base: 1.0625rem;
  --fs-md:   1.125rem;
  --fs-lg:   1.35rem;
  --fs-xl:   1.75rem;
  --fs-2xl:  2.25rem;
  --fs-hero: clamp(2.2rem, 5vw, 4rem);

  --lh-tight:  1.25;
  --lh-normal: 1.7;
  --lh-loose:  1.9;

  --fw-light:   300;
  --fw-regular: 400;
  --fw-medium:  500;
  --fw-semibold: 600;
  --fw-bold:   700;
  --fw-extrabold: 800;
  --fw-black:  900;

  /* spacing */
  --space-1:  0.25rem;
  --space-2:  0.5rem;
  --space-3:  0.75rem;
  --space-4:  1rem;
  --space-5:  1.25rem;
  --space-6:  1.5rem;
  --space-8:  2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  --space-24: 6rem;

  /* layout */
  --content-max: 820px;
  --nav-height: 56px;
  --sidebar-width: 280px;
  --radius-sm:  6px;
  --radius-md:  10px;
  --radius-lg:  16px;

  /* motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --duration-fast: 200ms;
  --duration-normal: 400ms;
  --duration-slow: 600ms;
}

/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── Base ─── */
html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-height) + var(--space-6));
}
body {
  font-family: 'Vazirmatn', sans-serif;
  background: var(--bg-page);
  color: var(--text-secondary);
  line-height: var(--lh-loose);
  font-size: var(--fs-base);
  -webkit-font-smoothing: antialiased;
}

/* ─── Skip Link ─── */
.skip-link {
  position: fixed;
  top: var(--space-2);
  right: var(--space-2);
  z-index: 10000;
  background: var(--gold-400);
  color: var(--clay-900);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  font-weight: var(--fw-bold);
  font-size: var(--fs-sm);
  text-decoration: none;
  transform: translateY(-120%);
  transition: transform var(--duration-fast) var(--ease-out);
}
.skip-link:focus { transform: translateY(0); }

::selection { background: var(--gold-400); color: var(--clay-900); }
:focus-visible { outline: 2px solid var(--gold-400); outline-offset: 3px; border-radius: var(--radius-sm); }

/* ═══════════════════════════════════════════════════════
   Top Navigation
   ═══════════════════════════════════════════════════════ */
.top-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 500;
  height: var(--nav-height);
  background: var(--bg-nav);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-med);
  display: flex;
  align-items: center;
  padding: 0 var(--space-6);
  gap: var(--space-4);
}
.top-nav-logo {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  text-decoration: none;
  color: var(--text-primary);
  font-weight: var(--fw-extrabold);
  font-size: var(--fs-sm);
  white-space: nowrap;
  flex-shrink: 0;
}
.top-nav-logo .logo-icon {
  width: 28px; height: 28px;
  border: 2px solid var(--gold-400);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-xs);
  color: var(--gold-400);
  flex-shrink: 0;
}
.top-nav-chapter {
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  text-align: center;
}
.top-nav-chapter span { color: var(--text-gold); font-weight: var(--fw-medium); }
.top-nav-progress {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-shrink: 0;
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  direction: ltr;
}
.top-nav-progress .progress-pct {
  color: var(--text-gold);
  font-weight: var(--fw-semibold);
  min-width: 2.5em;
  text-align: right;
}
.top-nav-progress .progress-track {
  width: 80px; height: 4px;
  background: var(--border-med);
  border-radius: 4px;
  overflow: hidden;
}
.top-nav-progress .progress-fill {
  height: 100%;
  background: var(--gold-400);
  width: 0%;
  border-radius: 4px;
  transition: width 150ms linear;
}
.nav-toggle {
  display: none;
  background: none;
  border: 1px solid var(--border-med);
  color: var(--text-secondary);
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  transition: background var(--duration-fast) var(--ease-out);
  font-size: var(--fs-lg);
  line-height: 1;
}
.nav-toggle:hover { background: var(--bg-card); }

/* ═══════════════════════════════════════════════════════
   Sidebar / Chapter Navigator
   ═══════════════════════════════════════════════════════ */
.chapter-nav {
  position: fixed;
  top: var(--nav-height);
  right: 0;
  width: var(--sidebar-width);
  height: calc(100vh - var(--nav-height));
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg-elevated);
  border-left: 1px solid var(--border-med);
  padding: var(--space-6) var(--space-3) var(--space-12);
  z-index: 400;
  transition: transform var(--duration-normal) var(--ease-out);
  scrollbar-width: thin;
  scrollbar-color: var(--clay-500) transparent;
}
.chapter-nav::-webkit-scrollbar { width: 3px; }
.chapter-nav::-webkit-scrollbar-thumb { background: var(--clay-500); border-radius: 3px; }
.chapter-nav::-webkit-scrollbar-track { background: transparent; }
.chapter-nav.open { transform: translateX(0); }

.chapter-nav-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 399;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.chapter-group { margin-bottom: var(--space-6); }
.chapter-group-header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  font-size: var(--fs-xs);
  font-weight: var(--fw-bold);
  color: var(--text-gold);
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: var(--space-1);
}
.chapter-group-header .ch-num {
  font-size: 0.65rem;
  color: var(--text-tertiary);
  font-weight: var(--fw-regular);
  font-family: monospace;
  direction: ltr;
}
.ch-nav-list { list-style: none; }
.ch-nav-item { margin: 0; }
.ch-nav-link {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  color: var(--text-tertiary);
  text-decoration: none;
  font-size: var(--fs-xs);
  font-weight: var(--fw-regular);
  border-radius: var(--radius-sm);
  transition: all var(--duration-fast) var(--ease-out);
  line-height: var(--lh-tight);
}
.ch-nav-link:hover {
  color: var(--text-gold);
  background: rgba(199, 164, 91, 0.06);
}
.ch-nav-link.active {
  color: var(--text-gold-bright);
  background: rgba(199, 164, 91, 0.1);
  font-weight: var(--fw-medium);
}
.ch-nav-link .s-num {
  font-size: 0.65rem;
  color: var(--stone-500);
  direction: ltr;
  min-width: 1.8em;
  text-align: left;
  font-family: monospace;
  opacity: 0.6;
}
.ch-nav-link.active .s-num { opacity: 1; color: var(--gold-500); }

/* ═══════════════════════════════════════════════════════
   Main Content
   ═══════════════════════════════════════════════════════ */
.main {
  padding-top: var(--nav-height);
  padding-right: var(--sidebar-width);
  min-height: 100vh;
}
.main-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--space-12) var(--space-8) var(--space-24);
}

/* ─── Hero ─── */
.hero {
  position: relative;
  padding: var(--space-20) 0 var(--space-16);
  margin-bottom: var(--space-16);
  text-align: center;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(199,164,91,0.03) 40px, rgba(199,164,91,0.03) 41px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(199,164,91,0.03) 40px, rgba(199,164,91,0.03) 41px);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  color: var(--text-gold);
  background: rgba(199, 164, 91, 0.08);
  border: 1px solid var(--border-gold);
  padding: var(--space-1) var(--space-4);
  border-radius: 100px;
  margin-bottom: var(--space-6);
}
.hero h1 {
  font-size: var(--fs-hero);
  font-weight: var(--fw-black);
  color: var(--text-primary);
  line-height: var(--lh-tight);
  margin-bottom: var(--space-4);
}
.hero h1 .gold {
  display: block;
  background: linear-gradient(135deg, var(--gold-200), var(--gold-400), var(--gold-500));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p {
  font-size: var(--fs-md);
  color: var(--text-tertiary);
  max-width: 540px;
  margin: 0 auto var(--space-8);
  line-height: var(--lh-normal);
}
.hero-stats {
  display: flex;
  justify-content: center;
  gap: var(--space-8);
  flex-wrap: wrap;
}
.hero-stat { text-align: center; }
.hero-stat-num {
  display: block;
  font-size: var(--fs-2xl);
  font-weight: var(--fw-black);
  color: var(--text-gold);
  line-height: 1;
  margin-bottom: var(--space-1);
}
.hero-stat-label {
  font-size: var(--fs-xs);
  color: var(--text-tertiary);
  font-weight: var(--fw-medium);
}

/* ─── Chapter Divider ─── */
.chapter-divider {
  position: relative;
  margin: var(--space-20) 0 var(--space-12);
  padding: var(--space-8) 0 var(--space-6);
  border-top: 1px solid var(--border-med);
}
.chapter-divider::before {
  content: '';
  position: absolute;
  top: -1px;
  right: 0;
  width: 60px;
  height: 2px;
  background: var(--gold-400);
}
.chapter-divider-label {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--fs-xs);
  font-weight: var(--fw-bold);
  color: var(--gold-500);
  margin-bottom: var(--space-3);
}
.chapter-divider-label .ch-label-num {
  background: rgba(199, 164, 91, 0.1);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
  font-family: monospace;
  direction: ltr;
  font-size: 0.7rem;
}
.chapter-divider h2 {
  font-size: var(--fs-xl);
  font-weight: var(--fw-extrabold);
  color: var(--text-primary);
  margin-bottom: var(--space-2);
}
.chapter-divider p {
  font-size: var(--fs-sm);
  color: var(--text-tertiary);
  max-width: 600px;
}

/* ─── Sections ─── */
.section {
  margin-bottom: var(--space-8);
  position: relative;
}
.section-header {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border-light);
}
.section-num {
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  color: var(--gold-400);
  background: rgba(199, 164, 91, 0.06);
  padding: 0 var(--space-3);
  border-radius: var(--radius-sm);
  font-family: monospace;
  direction: ltr;
  white-space: nowrap;
  line-height: 1.8;
  flex-shrink: 0;
}
.section h2 {
  font-size: var(--fs-lg);
  font-weight: var(--fw-bold);
  color: var(--text-primary);
  line-height: var(--lh-tight);
}

/* ─── Content Elements ─── */
.section p { margin-bottom: var(--space-4); }
.section p:last-child { margin-bottom: 0; }
.section ul, .section ol {
  margin: var(--space-3) 0 var(--space-5);
  padding-right: var(--space-6);
}
.section li { margin-bottom: var(--space-2); }
.section li:last-child { margin-bottom: 0; }
.section strong { color: var(--text-primary); font-weight: var(--fw-semibold); }
.section em { color: var(--gold-400); font-style: normal; font-weight: var(--fw-medium); }
.section h3 {
  font-size: var(--fs-md);
  font-weight: var(--fw-semibold);
  color: var(--gold-300);
  margin: var(--space-6) 0 var(--space-3);
  line-height: var(--lh-tight);
}

/* ─── Blockquote ─── */
blockquote {
  position: relative;
  border-right: 2px solid var(--gold-400);
  padding: var(--space-4) var(--space-6);
  margin: var(--space-4) 0 var(--space-6);
  background: var(--bg-elevated);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  color: var(--text-secondary);
  font-weight: var(--fw-medium);
  line-height: var(--lh-normal);
}
blockquote strong { color: var(--text-gold); }

/* ─── Code ─── */
code {
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 0.8em;
  background: var(--bg-code);
  color: var(--gold-200);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  direction: ltr;
  display: inline-block;
  line-height: 1.5;
  border: 1px solid var(--border-light);
}
pre {
  direction: ltr;
  text-align: left;
  background: var(--bg-code);
  border: 1px solid var(--border-med);
  border-radius: var(--radius-md);
  padding: var(--space-5) var(--space-6);
  margin: var(--space-4) 0 var(--space-6);
  overflow-x: auto;
  font-size: var(--fs-xs);
  line-height: var(--lh-loose);
  color: var(--stone-200);
}
pre code { background: transparent; padding: 0; border: none; font-size: inherit; color: inherit; }

/* ─── Tables ─── */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  margin: var(--space-4) 0 var(--space-6);
  font-size: var(--fs-sm);
  border: 1px solid var(--border-med);
  border-radius: var(--radius-md);
  overflow: hidden;
}
th, td {
  border-bottom: 1px solid var(--border-light);
  border-left: 1px solid var(--border-light);
  padding: var(--space-3) var(--space-4);
  text-align: right;
  vertical-align: top;
}
th {
  background: var(--bg-elevated);
  color: var(--gold-300);
  font-weight: var(--fw-semibold);
  font-size: var(--fs-xs);
}
td { color: var(--text-secondary); }
tr:last-child td { border-bottom: none; }
td:last-child, th:last-child { border-left: none; }

/* ─── Highlight Boxes ─── */
.highlight-box {
  background: var(--bg-card);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-md);
  padding: var(--space-5) var(--space-6);
  margin: var(--space-4) 0 var(--space-6);
}
.highlight-box.gold {
  border-color: var(--gold-400);
  background: linear-gradient(135deg, rgba(199,164,91,0.04), rgba(199,164,91,0.01));
}
.highlight-box.warn {
  border-color: rgba(255,180,50,0.2);
  background: rgba(255,180,50,0.03);
}

/* ─── Cheatsheet ─── */
.cheatsheet {
  background: var(--bg-elevated);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-lg);
  padding: var(--space-6) var(--space-8);
  margin: var(--space-6) 0;
  font-size: var(--fs-sm);
  line-height: 2;
}
.cheatsheet pre {
  background: transparent;
  border: none;
  padding: 0;
  margin: 0;
  font-size: var(--fs-xs);
  line-height: 1.9;
  color: var(--stone-200);
}

/* ─── Phase List ─── */
.phase-list {
  list-style: none;
  padding: 0;
  margin: var(--space-4) 0 var(--space-6);
  counter-reset: phase-counter;
}
.phase-list li {
  counter-increment: phase-counter;
  display: flex;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
  margin-bottom: var(--space-3);
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
  transition: border-color var(--duration-fast) var(--ease-out);
  align-items: flex-start;
}
.phase-list li:hover { border-color: var(--border-gold); }
.phase-list li::before {
  content: counter(phase-counter);
  font-family: monospace;
  font-size: var(--fs-sm);
  font-weight: var(--fw-bold);
  color: var(--gold-400);
  background: rgba(199,164,91,0.08);
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  direction: ltr;
}
.phase-list li strong {
  display: block;
  color: var(--text-primary);
  font-weight: var(--fw-semibold);
  margin-bottom: var(--space-1);
}

/* ─── Misc Components ─── */
.task-contract {
  background: var(--bg-elevated);
  border: 1px solid var(--border-med);
  border-radius: var(--radius-md);
  padding: var(--space-5) var(--space-6);
  margin: var(--space-4) 0 var(--space-6);
  font-size: var(--fs-sm);
  line-height: var(--lh-normal);
}
.task-contract pre {
  background: transparent; border: none; padding: 0; margin: 0; font-size: var(--fs-xs);
}

.prompt-example {
  background: var(--clay-800);
  border: 1px solid var(--border-med);
  border-radius: var(--radius-md);
  padding: var(--space-5) var(--space-6);
  margin: var(--space-4) 0 var(--space-6);
  font-size: var(--fs-sm);
  position: relative;
}
.prompt-example::before {
  content: 'نمونه پرامپت';
  position: absolute;
  top: var(--space-2);
  left: var(--space-3);
  font-size: 0.65rem;
  font-weight: var(--fw-bold);
  color: var(--gold-500);
}
.prompt-example pre {
  background: transparent; border: none; padding: 0;
  margin-top: var(--space-4); font-size: var(--fs-xs);
}

.milestone {
  display: flex;
  align-items: flex-start;

}
.milestone-icon {
  width: 36px; height: 36px;
  background: rgba(199,164,91,0.1);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;

}
.milestone-content strong {
  display: block;

}

.rule-card {

}

.two-col {

/* ─── Reading Progress ─── */
.reading-progress-global {
  position: fixed;
  top: var(--nav-height);
  left: 0;
  right: var(--sidebar-width);
  height: 2px;
  background: transparent;
  z-index: 499;
  pointer-events: none;
}
.reading-progress-global .rp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-400), var(--gold-200));
  width: 0%;
  transition: width 80ms linear;
}

/* ═══════════════════════════════════════════════════════
   Animations
   ═══════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: no-preference) {
  .section.reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity var(--duration-slow) var(--ease-out),
                transform var(--duration-slow) var(--ease-out);
  }
  .section.reveal.visible { opacity: 1; transform: translateY(0); }
  .hero {
    opacity: 0;
    transform: translateY(30px);
    animation: heroIn var(--duration-slow) var(--ease-out) 0.1s forwards;
  }
  @keyframes heroIn { to { opacity: 1; transform: translateY(0); } }
  .chapter-divider.reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity var(--duration-slow) var(--ease-out),
                transform var(--duration-slow) var(--ease-out);
  }
  .chapter-divider.reveal.visible { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .section.reveal, .chapter-divider.reveal, .hero { opacity: 1; transform: none; animation: none; }
}

/* ═══════════════════════════════════════════════════════
   Responsive
   ═══════════════════════════════════════════════════════ */
@media (max-width: 1100px) {
  .main { padding-right: 0; }
  .reading-progress-global { right: 0; }
  .chapter-nav {
    transform: translateX(100%);
    width: 300px;
    box-shadow: -8px 0 40px rgba(0,0,0,0.5);
  }
  .chapter-nav.open { transform: translateX(0); }
  .chapter-nav-overlay.visible { display: block; }

}
@media (max-width: 768px) {
  .top-nav { padding: 0 var(--space-4); }
  .top-nav-chapter { display: none; }
  .top-nav-progress .progress-track { width: 60px; }
  .main-inner { padding: var(--space-8) var(--space-4) var(--space-16); }
  .hero { padding: var(--space-12) 0 var(--space-10); }
  .hero-stats { gap: var(--space-5); }

  .two-col { grid-template-columns: 1fr; }

@media (max-width: 480px) {

  .top-nav-progress .progress-track { width: 40px; }
  .hero-stat-num { font-size: var(--fs-lg); }

}

/* ═══════════════════════════════════════════════════════
   Print
   ═══════════════════════════════════════════════════════ */
@media print {
  .top-nav, .chapter-nav, .chapter-nav-overlay,

  body { color: #111; background: #fff; }
  .section h2, .hero h1, .chapter-divider h2,
  strong { color: #111; }
  td { color: #333; }
  .section p { color: #333; }
  .text-tertiary { color: #666; }
  .section-num { color: #8a7030; }
  .section-header { border-bottom-color: #ddd; }

  .highlight-box, .milestone, .cheatsheet,

  pre { background: #f5f5f5; border-color: #ddd; color: #333; }
  code { background: #f0f0f0; color: #555; }
  table { border-color: #ddd; }
  th { background: #f0f0f0; color: #333; }
  td { border-color: #ddd; }
  .phase-list li { background: #f8f8f8; border-color: #ddd; }
  blockquote { background: #f8f8f8; color: #444; }
  .hero h1 .gold {
    -webkit-text-fill-color: #8a7030;
    color: #8a7030;
  }
  .text-gold { color: #8a7030; }
}

/* ═══════════════════════════════════════════════════════
   Utility
   ═══════════════════════════════════════════════════════ */

.sr-only {

</div>

<!-- ═══ Top Navigation ═══ -->
<header class="top-nav" role="banner">
  <button class="nav-toggle" id="navToggle" aria-controls="chapterNav" aria-expanded="false" aria-label="باز کردن فهرست">

  <a href="#" class="top-nav-logo" aria-label="سرزمین — راهنمای تولید سه‌بعدی">

  <div id="chapterNavContent"></div>

<!-- ═══ Main Content ═══ -->
<main class="main" id="content-container"></main>
<script>
/* ═══════════════════════════════════════════════════════
   Sarzamin Playbook — JavaScript
   ═══════════════════════════════════════════════════════ */
(function(){ 'use strict';
  /* ─── Gate bootstrap ─── */
  var gateReady = false;

  window.initPostRender = function(){

  /* ─── Chapter metadata ─── */
  const chapters = [
    { num: 1, label: 'مبانی Workflow', sections: ['s1','s2','s3','s4','s5'] },
    { num: 2, label: 'کار با عامل‌ها', sections: ['s6','s7','s8','s9','s10','s11','s12','s13'] },
    { num: 3, label: 'قفل، بررسی و بازخورد', sections: ['s14','s15','s16','s17','s18','s19','s20','s21','s22'] },
    { num: 4, label: 'خط تولید', sections: ['s23','s24','s25','s26','s27','s28','s29','s30','s31'] },
    { num: 5, label: 'مهارت و تمرین', sections: ['s32','s33','s34','s35','s36','s37','s38','s39','s40'] },
  ];
  const cheatId = 's-cheat';
  const totalSections = 40;

  /* ─── Build sidebar nav ─── */
  function buildNav() {
    var container = document.getElementById('chapterNavContent');
    var html = '';
    chapters.forEach(function(ch) {
      html += '<div class="chapter-group" data-ch="' + ch.num + '">';
      html += '<div class="chapter-group-header"><span class="ch-num">' + padNum(ch.num) + '</span> ' + ch.label + '</div>';
      html += '<ul class="ch-nav-list">';
      ch.sections.forEach(function(id) {
        var sec = document.getElementById(id);
        if (!sec) return;
        var numEl = sec.querySelector('.section-num');
        var titleEl = sec.querySelector('h2');
        var num = numEl ? numEl.textContent.trim() : '';
        var title = titleEl ? titleEl.textContent.trim() : '';
        html += '<li class="ch-nav-item"><a href="#' + id + '" class="ch-nav-link" data-section="' + id + '">';
        html += '<span class="s-num">' + padNum(num) + '</span> ' + escapeHtml(title) + '</a></li>';
      });
      html += '</ul></div>';
    });
    // Cheat sheet
    html += '<div class="chapter-group">';
    html += '<div class="chapter-group-header"><span class="ch-num">⚡</span> برگۀ تقلب</div>';
    html += '<ul class="ch-nav-list"><li class="ch-nav-item"><a href="#s-cheat" class="ch-nav-link" data-section="s-cheat">';
    html += '<span class="s-num">⚡</span> Cheat Sheet &amp; Workflow</a></li></ul></div>';
    container.innerHTML = html;
  }

  function padNum(n) {
    n = String(n);
    return n.length === 1 ? '0' + n : n;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  /* ─── Chapter/Section helpers ─── */
  function getSectionChapter(sectionId) {
    for (var i = 0; i < chapters.length; i++) {
      if (chapters[i].sections.indexOf(sectionId) !== -1) return chapters[i];
    }
    return null;
  }

  function getChapterIndex(sectionId) {
    for (var i = 0; i < chapters.length; i++) {
      if (chapters[i].sections.indexOf(sectionId) !== -1) return i;
    }
    return -1;
  }

  function getSectionIndex(sectionId) {
    if (sectionId === cheatId) return totalSections;
    for (var i = 0; i < chapters.length; i++) {
      var idx = chapters[i].sections.indexOf(sectionId);
      if (idx !== -1) {
        var offset = 0;
        for (var j = 0; j < i; j++) offset += chapters[j].sections.length;
        return offset + idx + 1;
      }
    }
    return 0;
  }

  /* ─── IntersectionObserver for active section ─── */
  var sectionEls = document.querySelectorAll('.section');
  var navLinks = {};
  var activeSectionId = null;

  // Collect nav links
  document.querySelectorAll('.ch-nav-link').forEach(function(link) {
    var id = link.getAttribute('data-section');
    if (id) navLinks[id] = link;
  });

  function updateActive(id) {
    if (id === activeSectionId) return;
    activeSectionId = id;

    // Update nav links
    Object.keys(navLinks).forEach(function(key) {
      navLinks[key].classList.toggle('active', key === id);
    });

    // Update chapter indicator in top nav
    var ch = getSectionChapter(id);
    var chEl = document.getElementById('currentChapter');
    if (ch && chEl) {
      chEl.innerHTML = '<span>' + ch.num + '</span> / ۵ — ' + ch.label;
    } else if (id === cheatId && chEl) {
      chEl.innerHTML = '<span>⚡</span> / ۵ — برگۀ تقلب';
    }

    // Progress
    var idx = getSectionIndex(id);
    var pct = Math.round((idx / totalSections) * 100);
    document.getElementById('progressPct').textContent = pct + '٪';
    document.getElementById('progressFill').style.width = pct + '%';
    var gp = document.getElementById('globalProgressFill');
    if (gp) gp.style.width = pct + '%';
  }

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      var visible = [];
      entries.forEach(function(entry) {
        if (entry.isIntersecting) visible.push(entry.target.id);
      });
      if (visible.length > 0) {
        // Pick the one closest to the top
        var best = null;
        var bestTop = Infinity;
        visible.forEach(function(id) {
          var el = document.getElementById(id);
          if (el) {
            var rect = el.getBoundingClientRect();
            if (rect.top < bestTop) {
              bestTop = rect.top;
              best = id;
            }
          }
        });
        if (best) updateActive(best);
      }
    }, { threshold: 0.2, rootMargin: '-80px 0px -40% 0px' });

    sectionEls.forEach(function(sec) { observer.observe(sec); });
  } else {
    // Fallback: scroll listener
    var allIds = [];
    chapters.forEach(function(ch) {
      ch.sections.forEach(function(id) { allIds.push(id); });
    });
    allIds.push(cheatId);

    window.addEventListener('scroll', function() {
      var scrollY = window.scrollY + 120;
      var current = allIds[0];
      allIds.forEach(function(id) {
        var el = document.getElementById(id);
        if (el && el.offsetTop <= scrollY) current = id;
      });
      updateActive(current);
    }, { passive: true });
  }

  /* ─── Reading progress (rAF) ─── */
  var progressBar = document.getElementById('globalProgressFill');
  if (progressBar) {
    function updateProgress() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = pct + '%';
      requestAnimationFrame(updateProgress);
    }
    requestAnimationFrame(updateProgress);
  }

  /* ─── Nav toggle (mobile) ─── */
  var toggleBtn = document.getElementById('navToggle');
  var nav = document.getElementById('chapterNav');
  var overlay = document.getElementById('navOverlay');
  var navOpen = false;

  function openNav() {
    navOpen = true;
    nav.classList.add('open');
    overlay.classList.add('visible');
    toggleBtn.setAttribute('aria-expanded', 'true');
    toggleBtn.innerHTML = '<span aria-hidden="true">✕</span>';
    document.body.style.overflow = 'hidden';
  }

  function closeNav() {
    navOpen = false;
    nav.classList.remove('open');
    overlay.classList.remove('visible');
    toggleBtn.setAttribute('aria-expanded', 'false');
    toggleBtn.innerHTML = '<span aria-hidden="true">☰</span>';
    document.body.style.overflow = '';
    toggleBtn.focus();
  }

  if (toggleBtn && nav) {
    toggleBtn.addEventListener('click', function() {
      navOpen ? closeNav() : openNav();
    });

    overlay.addEventListener('click', closeNav);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && navOpen) closeNav();
    });

    // Close on link click
    nav.querySelectorAll('.ch-nav-link').forEach(function(link) {
      link.addEventListener('click', function() {
        if (window.innerWidth <= 1100) closeNav();
      });
    });
  }

  /* ─── Entrance reveals ─── */
  if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    var revealEls = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
      var revealObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      revealEls.forEach(function(el) { revealObserver.observe(el); });
    } else {
      revealEls.forEach(function(el) { el.classList.add('visible'); });
    }
  } else {
    document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('visible'); });
  }

  /* ─── Init ─── */
  buildNav();

  // Set initial active section from hash or first
  var hash = window.location.hash.replace('#', '');
  var initialId = hash && document.getElementById(hash) ? hash : 's1';
  // Re-collect nav links after buildNav
  document.querySelectorAll('.ch-nav-link').forEach(function(link) {
    var id = link.getAttribute('data-section');
    if (id) navLinks[id] = link;
  });
  updateActive(initialId);

  // Set initial progress
  var initIdx = getSectionIndex(initialId);
  var initPct = Math.round((initIdx / totalSections) * 100);
  document.getElementById('progressPct').textContent = initPct + '٪';
  document.getElementById('progressFill').style.width = initPct + '%';
  }; // end initPostRender

  /* ─── Don't auto-init; gate script calls initPostRender after decrypt ─── */
})();
</script>

const PBKDF2_ITERATIONS = 600000;

<script>
(function(){
// ─── Password Gate ───
const STORAGE_KEY = "sz_playbook_auth";

function base64ToBytes(b64) {
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
}

async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
    );
}

async function decryptContent(password) {
    try {
        const raw = base64ToBytes(ENCRYPTED_BLOB);
        const salt = raw.slice(0, 16);
        const nonce = raw.slice(16, 28);
        const ct = raw.slice(28);
        const key = await deriveKey(password, salt);
        const plain = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: nonce }, key, ct
        );
        return new TextDecoder().decode(plain);
    } catch { return null; }
}

async function unlock(password) {
    const content = await decryptContent(password);
    if (!content) return false;
    sessionStorage.setItem(STORAGE_KEY, "1");
    renderContent(content);
    return true;
}

function renderContent(html) {
    const container = document.getElementById("content-container");
    container.innerHTML = html;
    document.getElementById("gate-screen").style.display = "none";
    container.style.display = "block";
    // Re-init scroll spy and progress
    if (window.initPostRender) window.initPostRender();
}

// ─── Gate UI ───
function showGate() {
    const container = document.getElementById("content-container");
    container.style.display = "none";
    const gate = document.createElement("div");
    gate.id = "gate-screen";
    gate.innerHTML = `
    <div class="gate-overlay">
      <div class="gate-box">
        <div class="gate-icon">🔐</div>
        <h1 class="gate-title">سرزمین</h1>
        <p class="gate-sub">۳D Production Playbook</p>
        <p class="gate-hint">این صفحه خصوصی است. رمز عبور را وارد کنید.</p>
        <input type="password" id="gate-password"
               placeholder="رمز عبور" autocomplete="off"
               class="gate-input">
        <p class="gate-error" id="gate-error" style="display:none">رمز اشتباه است.</p>
        <button class="gate-btn" id="gate-btn">ورود</button>
      </div>
    </div>`;
    document.body.insertBefore(gate, document.body.firstChild);

    const input = document.getElementById("gate-password");
    const btn = document.getElementById("gate-btn");
    const err = document.getElementById("gate-error");

    async function attempt() {
        err.style.display = "none";
        btn.disabled = true;
        btn.textContent = "در حال بررسی…";
        const ok = await unlock(input.value);
        if (!ok) {
            err.style.display = "block";
            btn.disabled = false;
            btn.textContent = "ورود";
            input.value = "";
            input.focus();
        }
    }

    btn.addEventListener("click", attempt);
    input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
    input.focus();
}

// ─── Bootstrap ───
(async function() {
    // If already authed this session, try silent decrypt
    if (sessionStorage.getItem(STORAGE_KEY)) {
        const pwd = prompt("🔐 رمز عبور:");
        if (pwd && await unlock(pwd)) return;
        sessionStorage.removeItem(STORAGE_KEY);
    }
    showGate();
})();
</script>
